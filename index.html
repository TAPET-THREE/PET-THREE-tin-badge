<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>缶バッジ専用 トリミング＆実寸PDF生成ツール</title>
  
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
    }

    header p {
      color: #64748b;
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 900px) {
      .main-grid {
        grid-template-columns: 1.2fr 0.8fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--bg-color);
    }

    /* 編集エリア */
    .editor-wrapper {
      width: 100%;
      height: 420px;
      background-color: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .editor-wrapper img {
      max-width: 100%;
      max-height: 100%;
    }

    .cropper-view-box, .cropper-face {
      border-radius: 50%;
    }

    .cropper-view-box {
      outline: 2px solid #3b82f6;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover { background-color: #f1f5f9; }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }

    .btn-success {
      background-color: #059669;
      color: white;
      border: none;
    }
    .btn-success:hover { background-color: #047857; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      background-color: #fff;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .badge-mockup {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), inset 0 -3px 6px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.7);
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .info-box {
      background-color: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 12px;
      font-size: 0.85rem;
      color: #1e40af;
      border-radius: 0 6px 6px 0;
      margin-top: 12px;
    }

    .info-box ul {
      margin-left: 16px;
      margin-top: 4px;
    }

    .file-drop-area {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      background-color: #f8fafc;
      cursor: pointer;
    }

    .file-drop-area input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>缶バッジ専用 トリミング＆実寸PDF生成ツール</h1>
    <p>位置やズームを目視で調整し、ミリ単位で正確なA4実寸印刷用PDFを出力します</p>
  </header>

  <div class="main-grid">
    <!-- 左側：画像読み込みと編集エリア -->
    <div class="card">
      <div class="card-title">1. 画像の調整</div>

      <div id="dropArea" class="file-drop-area" onclick="document.getElementById('imageInput').click()">
        <p style="font-weight: 600; color: #475569;">クリックして画像を選択</p>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">または画像をここにドラッグ＆ドロップ</p>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="editor-wrapper" id="editorWrapper" style="display: none; margin-top: 16px;">
        <img id="sourceImage" src="" alt="編集用画像">
      </div>

      <div class="controls-grid" id="controls" style="display: none;">
        <button class="btn" onclick="rotateImage(-90)">↺ 左に回転</button>
        <button class="btn" onclick="rotateImage(90)">↻ 右に回転</button>
        <button class="btn" onclick="zoomImage(0.1)">＋ 拡大</button>
        <button class="btn" onclick="zoomImage(-0.1)">－ 縮小</button>
        <button class="btn" onclick="resetCrop()" style="grid-column: span 2;">位置のリセット</button>
      </div>
    </div>

    <!-- 右側：設定と完成プレビュー -->
    <div class="card">
      <div class="card-title">2. サイズ設定・出力</div>

      <div class="form-group">
        <label for="sizeSelect">缶バッジのサイズを選択</label>
        <select id="sizeSelect" class="form-control" onchange="updateSizeParams()">
          <option value="58" selected>58mm（標準サイズ / 印刷原稿径 70mm）</option>
          <option value="32">32mm（小サイズ / 印刷原稿径 44mm）</option>
          <option value="44">44mm（中サイズ / 印刷原稿径 54mm）</option>
          <option value="75">75mm（大サイズ / 印刷原稿径 86mm）</option>
        </select>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="showGuides" checked onchange="renderPreview()">
          ガイド線（カット線・表面境界線）を描画する
        </label>
      </div>

      <div class="preview-container" style="margin-top: 20px;">
        <div>
          <p style="text-align:center; font-size: 0.85rem; color: #64748b; margin-bottom: 8px;">【仕上がり立体イメージ】</p>
          <div id="badgeMockup" class="badge-mockup"></div>
        </div>

        <div class="action-buttons">
          <button id="pdfBtn" class="btn btn-success" style="padding: 12px; font-size: 1rem;" disabled onclick="downloadRealSizePDF()">
            📄 A4実寸PDFをダウンロード（上揃え）
          </button>

          <button id="downloadBtn" class="btn btn-primary" style="padding: 10px; font-size: 0.9rem;" disabled onclick="downloadBadgeImage()">
            単体PNG画像を保存
          </button>
        </div>
      </div>

      <div class="info-box">
        <strong>印刷時の設定（非常に重要）：</strong>
        <ul>
          <li>ダウンロードしたPDFをAdobe Acrobat Readerやブラウザで開きます。</li>
          <li>印刷設定のページ倍率で <strong>「100%」</strong> または <strong>「実際のサイズ」</strong> を選択してください。</li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- JSライブラリ: Cropper.js & jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  let cropper = null;
  const imageInput = document.getElementById('imageInput');
  const sourceImage = document.getElementById('sourceImage');
  const editorWrapper = document.getElementById('editorWrapper');
  const dropArea = document.getElementById('dropArea');
  const controls = document.getElementById('controls');
  const downloadBtn = document.getElementById('downloadBtn');
  const pdfBtn = document.getElementById('pdfBtn');
  const badgeMockup = document.getElementById('badgeMockup');

  // 原稿サイズマップ（mm単位）
  const SIZE_MAP = {
    '58': { outerMm: 70, surfaceRatio: 0.82, name: '58mm缶バッジ用' },
    '32': { outerMm: 44, surfaceRatio: 0.78, name: '32mm缶バッジ用' },
    '44': { outerMm: 54, surfaceRatio: 0.80, name: '44mm缶バッジ用' },
    '75': { outerMm: 86, surfaceRatio: 0.85, name: '75mm缶バッジ用' }
  };

  imageInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) loadImage(e.target.files[0]);
  });

  dropArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropArea.style.borderColor = 'var(--primary-color)';
  });

  dropArea.addEventListener('dragleave', () => {
    dropArea.style.borderColor = '#cbd5e1';
  });

  dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    dropArea.style.borderColor = '#cbd5e1';
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      sourceImage.src = e.target.result;
      editorWrapper.style.display = 'flex';
      controls.style.display = 'grid';
      
      if (cropper) cropper.destroy();

      cropper = new Cropper(sourceImage, {
        aspectRatio: 1,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.9,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        crop() {
          renderPreview();
        }
      });

      downloadBtn.disabled = false;
      pdfBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  }

  function rotateImage(degree) { if (cropper) cropper.rotate(degree); }
  function zoomImage(ratio) { if (cropper) cropper.zoom(ratio); }
  function resetCrop() { if (cropper) cropper.reset(); }
  function updateSizeParams() { if (cropper) renderPreview(); }

  // 高解像度Canvas生成 (2000x2000px)
  function generateBadgeCanvas() {
    if (!cropper) return null;

    const croppedCanvas = cropper.getCroppedCanvas({
      width: 2000,
      height: 2000,
      imageSmoothingEnabled: true,
      imageSmoothingQuality: 'high',
    });

    const canvas = document.createElement('canvas');
    canvas.width = 2000;
    canvas.height = 2000;
    const ctx = canvas.getContext('2d');

    // 円形マスク
    ctx.beginPath();
    ctx.arc(1000, 1000, 1000, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    ctx.drawImage(croppedCanvas, 0, 0, 2000, 2000);

    const showGuides = document.getElementById('showGuides').checked;
    if (showGuides) {
      const sizeKey = document.getElementById('sizeSelect').value;
      const sizeInfo = SIZE_MAP[sizeKey] || SIZE_MAP['58'];
      const surfaceRadius = 1000 * sizeInfo.surfaceRatio;

      // 表面有効境界線（青）
      ctx.beginPath();
      ctx.arc(1000, 1000, surfaceRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(59, 130, 246, 0.85)';
      ctx.lineWidth = 6;
      ctx.setLineDash([20, 15]);
      ctx.stroke();

      // 外径カットライン（赤）
      ctx.beginPath();
      ctx.arc(1000, 1000, 992, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
      ctx.lineWidth = 8;
      ctx.setLineDash([]);
      ctx.stroke();
    }

    return canvas;
  }

  function renderPreview() {
    const canvas = generateBadgeCanvas();
    if (canvas) {
      badgeMockup.style.backgroundImage = `url(${canvas.toDataURL('image/png')})`;
    }
  }

  function downloadBadgeImage() {
    const canvas = generateBadgeCanvas();
    if (!canvas) return;

    const sizeKey = document.getElementById('sizeSelect').value;
    const link = document.createElement('a');
    link.download = `badge_${sizeKey}mm_cropped.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // ★ 上揃え配置のA4実寸PDF生成（jsPDF） ★
  function downloadRealSizePDF() {
    const canvas = generateBadgeCanvas();
    if (!canvas) return;

    const sizeKey = document.getElementById('sizeSelect').value;
    const sizeInfo = SIZE_MAP[sizeKey] || SIZE_MAP['58'];

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    const imgData = canvas.toDataURL('image/png');
    
    const a4Width = 210;
    const outerMm = sizeInfo.outerMm; // 例: 58mm用なら70.0mm

    // 横方向は中央揃え、縦方向（Y軸）は上から 20mm の位置（上揃え）
    const xPos = (a4Width - outerMm) / 2;
    const yPos = 20; // 用紙の上端から20mm（2cm）余白

    // ミリメートル単位で正確に配置
    pdf.addImage(imgData, 'PNG', xPos, yPos, outerMm, outerMm);

    // 画像のすぐ下に補足テキストを配置
    pdf.setFontSize(10);
    pdf.text(`【A4実寸原稿】${sizeInfo.name}（カット外径: ${outerMm}mm）`, a4Width / 2, yPos + outerMm + 8, { align: 'center' });
    pdf.setFontSize(8);
    pdf.text("※印刷時は倍率を「100%」または「実際のサイズ」に設定してください。", a4Width / 2, yPos + outerMm + 13, { align: 'center' });

    pdf.save(`badge_${sizeKey}mm_a4_top_realsize.pdf`);
  }
</script>

</body>
</html>
